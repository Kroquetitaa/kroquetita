<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Título, descripción, tarjeta al compartir y datos estructurados: salen de src/seo/content.ts -->
    <!--seo:head-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kroquetita" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /* Currículum en texto bajo el lienzo: lo leen buscadores, asistentes de IA y lectores de pantalla.
         Sin JavaScript es la página; con la aplicación en marcha queda solo para lectores de pantalla. */
      html { background: #000; }
      #cv { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; color: #d6d9e0;
        font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif; opacity: 0; animation: cv-in 0.4s 4s forwards; }
      #cv a { color: #19e6ff; }
      #cv h1 { font-size: 1.7rem; line-height: 1.25; color: #fff; }
      #cv h2 { margin-top: 2.4rem; font-size: 1.2rem; color: #fff; }
      #cv h3 { margin-bottom: 0.2rem; font-size: 1rem; color: #fff; }
      #cv li { margin-bottom: 0.9rem; }
      #cv dt { margin-top: 0.9rem; font-weight: 600; color: #fff; }
      #cv dd { margin: 0.2rem 0 0; }
      @keyframes cv-in { to { opacity: 1; } }
      .app #cv { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
        clip-path: inset(50%); white-space: nowrap; animation: none; }
    </style>
    <noscript>
      <style>
        html, body { height: auto !important; overflow: auto !important; }
        #cv { opacity: 1; animation: none; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <!--seo:body-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
